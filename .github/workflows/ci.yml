name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    test:
        name: Verify / ${{ matrix.name }}
        runs-on: ${{ matrix.os }}

        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: ubuntu-amd64
                      os: ubuntu-24.04
                    - name: ubuntu-arm64
                      os: ubuntu-24.04-arm
                    - name: macos-arm64
                      os: macos-26

        env:
            CGO_ENABLED: "1"

        steps:
            - uses: actions/checkout@v7
              with:
                  submodules: recursive

            - uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Show Go version
              run: |
                  go version
                  go env GOOS GOARCH CGO_ENABLED

            - name: Check formatting
              run: test -z "$(gofmt -l $(git ls-files '*.go'))"

            - name: Vet
              run: go vet ./...

            - name: Build
              run: go build -v ./...

            - name: Test
              run: go test -v -count=1 ./...

            - name: Race test
              run: go test -v -race -count=1 ./...
