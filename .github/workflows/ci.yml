name: CI

on:
    push:
        branches: [main]
    pull_request:

env:
    # The module is pure Go. Building with cgo disabled is not a setting but
    # a check: if a cgo dependency comes back, every job here fails.
    CGO_ENABLED: "0"

jobs:
    test:
        name: Verify / ${{ matrix.name }}
        runs-on: ${{ matrix.os }}

        # gnark-crypto's field arithmetic has an assembly backend per
        # architecture, so architecture is what this matrix varies. The
        # operating system is not: darwin and linux on arm64 run the same
        # instructions, and the cross-compile job below covers that they
        # still build.
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: amd64
                      os: ubuntu-24.04
                    - name: arm64
                      os: ubuntu-24.04-arm

        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Show Go version
              run: |
                  go version
                  go env GOOS GOARCH CGO_ENABLED

            - name: Check formatting
              run: test -z "$(gofmt -l $(git ls-files '*.go'))"

            - name: Vet
              run: go vet ./...

            - name: Build
              run: go build -v ./...

            - name: Test
              run: go test -v -count=1 ./...

    race:
        name: Race
        runs-on: ubuntu-24.04

        # The race detector needs cgo, and finds the same races on any
        # architecture, so this runs once rather than across the matrix.
        env:
            CGO_ENABLED: "1"

        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Race test
              run: go test -race -count=1 ./...

    cross-compile:
        name: Cross compile / ${{ matrix.goos }}-${{ matrix.goarch }}
        runs-on: ubuntu-24.04

        # Targets worth knowing still build, but not worth a runner each.
        # js/wasm is here because it is what the cgo removal bought: it
        # could not be built at all before.
        strategy:
            fail-fast: false
            matrix:
                include:
                    - goos: darwin
                      goarch: arm64
                    - goos: darwin
                      goarch: amd64
                    - goos: windows
                      goarch: amd64
                    - goos: js
                      goarch: wasm

        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Build
              env:
                  GOOS: ${{ matrix.goos }}
                  GOARCH: ${{ matrix.goarch }}
              run: go build ./...
